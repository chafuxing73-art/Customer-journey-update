name: CI / Build & Docker Image

# 触发条件：推送到 main、针对 main 的 PR、手动触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支有新提交时取消旧的运行，节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则
permissions:
  contents: read

# 全局环境变量
env:
  # Docker 构建上下文（应用所在子目录）
  APP_DIR: sync_service
  # 镜像标签
  IMAGE_NAME: customer-journey-sync
  IMAGE_TAG: ${{ github.sha }}
  # 启用 BuildKit 加速构建
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  # ===== Job 1：代码质量 + 单元测试 =====
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 利用 setup-python 内置的 pip 缓存（key 基于 requirements.txt 哈希）
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint with ruff (non-blocking)
        run: ruff check app tests --exit-zero
        continue-on-error: true

      - name: Compile check (build verification)
        run: python -m compileall -q app tests

      - name: Run unit tests
        env:
          # 测试所需的环境变量（conftest 也会兜底设置）
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: Test123456
        run: pytest

  # ===== Job 2：构建 Docker 镜像并上传 artifact =====
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test  # 测试通过后才构建镜像
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 利用 GitHub Actions 缓存做 Docker layer 缓存
      - name: Build Docker image (load into daemon)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true  # 加载到本地 Docker daemon，供后续 docker save 使用
          push: false
          # 缓存到 GitHub Actions cache（type=gha）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        run: |
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --format 'Image built: {{.Id}} (size={{.Size}} bytes)'

      # 把镜像导出为 tar 文件，作为 artifact 上传（不上传公网镜像仓库）
      - name: Export image to tarball
        run: |
          mkdir -p artifacts
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o artifacts/${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          ls -lh artifacts/

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.IMAGE_TAG }}
          path: artifacts/*.tar
          # artifact 保留天数（默认 90 天，这里设 30 天节省存储）
          retention-days: 30
          if-no-files-found: error

  # ===== Job 3（可选）：推送到私有容器仓库 =====
  # 仅在配置了仓库凭证 secrets 时运行；默认不推送公网仓库。
  # 如需启用，在仓库 Settings → Secrets 中配置：
  #   REGISTRY_URL, REGISTRY_USERNAME, REGISTRY_PASSWORD, REGISTRY_IMAGE
  push-image:
    name: Push to Private Registry (optional)
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.REGISTRY_URL != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push to private registry
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          tags: |
            ${{ secrets.REGISTRY_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ secrets.REGISTRY_IMAGE }}:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
